name: Publish to GitHub Packages

on:
  # Trigger when you publish a GitHub Release
  release:
    types: [published]
  # Trigger when you push a tag like v1.2.3
  push:
    tags:
      - 'v*'
  # Manual trigger from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish (Bun)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Configure .npmrc for GitHub Packages
        run: |
          cat > .npmrc <<'EOF'
          //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}
          @${GITHUB_OWNER_LOWER}:registry=https://npm.pkg.github.com
          EOF
          # Replace the placeholder with the actual lowercase owner
          sed -i "s/\${GITHUB_OWNER_LOWER}/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/g" .npmrc
          cat .npmrc

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit || true

      - name: Publish to GitHub Packages
        run: bun publish --access restricted --no-git
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}